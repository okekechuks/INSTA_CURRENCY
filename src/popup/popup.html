<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instant Currency</title>
  </head>
  <body>
    <main class="popup-shell">
      <header>
        <p class="eyebrow">BROWSER SETTINGS</p>
        <h1>Instant Currency</h1>
      </header>

      <form id="preferences-form">
        <label class="field-label" for="target-currency">Convert to</label>
        <select id="target-currency" name="targetCurrency"></select>

        <div class="setting-list">
          <label class="setting-row" for="automatic-conversion">
            <span>Automatic conversion</span>
            <input id="automatic-conversion" name="automaticConversion" type="checkbox" />
          </label>
          <label class="setting-row" for="show-original-price">
            <span>Show original price</span>
            <input id="show-original-price" name="showOriginalPrice" type="checkbox" />
          </label>
          <label class="setting-row" for="current-site-enabled">
            <span>
              This site
              <small id="current-site-host">Detecting site</small>
            </span>
            <input id="current-site-enabled" name="currentSiteEnabled" type="checkbox" />
          </label>
        </div>
      </form>

      <p id="save-status" class="save-status" role="status" aria-live="polite"></p>
      <p id="rate-status" class="rate-status"></p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
